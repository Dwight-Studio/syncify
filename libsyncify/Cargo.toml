[package]
name = "libsyncify"
version = "0.1.0"
authors = ["Alexandre Leconte (Deleranax)", "Maxime Savary (GamerMine)"]
edition = "2024"
description = "A simple peer-to-peer, cross-platform file synchronization client"
readme = "../README.md"
repository = "https://github.com/Dwight-Studio/syncify"
license = "GPL-3"
keywords = ["p2p", "peer-to-peer", "cross-platform", "file", "sync"]
categories = ["filesystem", "gui", "command-line-interface"]
publish = false

[dependencies]
iroh = { version = "0.33.0", features = ["discovery-local-network"] }
iroh-gossip = { version = "0.33.0" }
iroh-blobs = { version = "0.33.0", features = ["downloader", "fs-store"] }
anyhow = "1.0.97"
directories = "6.0.0"
log = "0.4.26"
tokio = "1.44.0"
thiserror = "2.0.12"
uuid = "1.15.1"
keyring = { version = "3.6.2", features = ["linux-native-async-persistent", "apple-native", "windows-native", "crypto-rust", "tokio"] }
notify = "8.0.0"
futures-lite = "2.6.0"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.1.1"
base64 = "0.22.1"
blake3 = { version = "1.6.1", features = ["std", "mmap", "rayon"] }
futures = "0.3.31"
walkdir = "2.5.0"
rkyv = "0.8.10"
redb = "2.4.0"